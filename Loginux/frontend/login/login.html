<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entrar | Pão Quentinho</title><link rel="stylesheet" href="/login/login.css"></head><body><main class="login-container"><section class="login-card"><div class="login-logo">🥖</div><h1>Pão Quentinho</h1><p class="subtitulo">Padaria e Confeitaria</p><div id="loginFrame"><h2>Bem-vindo!</h2><p class="instrucao">Informe seu e-mail para continuar.</p><div class="form-group"><label for="email">E-mail</label><input type="email" id="email" placeholder="seuemail@exemplo.com" autocomplete="username" required></div><button class="btn-primary" type="button" onclick="verificarEmail()">Avançar</button></div><div id="senhaFrame" class="hidden"><h2>Acesse sua conta</h2><p id="nomeUsuario" class="saudacao"></p><div class="form-group"><label for="senha">Senha</label><input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required></div><div class="btn-group"><button class="btn-secondary" type="button" onclick="voltarEmail()">Voltar</button><button class="btn-primary" type="button" onclick="verificarSenha()">Entrar</button></div></div><p id="mensagemErro" class="erro-msg" role="alert"></p><p class="rodape-login">Produtos fresquinhos esperam por você.</p></section></main><script src="/login/login.js"></script></body></html>
