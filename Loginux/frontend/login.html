<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Padaria Padarado Pardo</title>
    <link rel="stylesheet" href="/frontend/login.css">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <h2>Padaria Padarado Pardal Pardo</h2>

            <form id="formLogin">
                <!-- Etapa 1: E-mail -->
                <div id="etapaEmail" class="form-group">
                    <label for="email">E-mail (só Gmail)</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
                    <button type="button" id="btnVerificarEmail" class="btn-primary" onclick="verificarEmail()">Avançar para a senha</button>
                </div>
        </section>
        <section>
            <!-- Etapa 2: Senha (oculta por padrão) -->
            <div id="etapaSenha" class="form-group hidden">
                <p id="saudacaoUsuario" class="saudacao"></p>
                <label for="senha">Senha (que pelo menos seja SEGURO)</label>
                <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password">
                <button type="button" id="btnVerificarSenha" class="btn-primary" onclick="">Avançar</button>

                <div class="btn-group">
                    <button type="button" id="btnVoltar" class="btn-secondary" onclick="voltarParaEmail()">Voltar</button>
                    <button type="submit" id="btnEntrar" class="btn-primary" onclick="realizarLogin()">Entrar</button>
                    <button type="button" id="btnEsqueci" class="btn-secondary" onclick="esqueciSenha()">Esqueci a senha</button>
                </div>
            </div>
        </section>
    <script src="login.js"></script>
</html>
