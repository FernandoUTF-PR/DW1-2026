
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Padaria Padarado Pardo</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-container">

        <!-- ETAPA 1: EMAIL -->
        <section class="login-card" id="cardEmail">

            <h2>Padaria Padarado Pardal Pardo</h2>
            <h2>LOGIN</h2>

            <form id="formEmail">

                <div class="form-group">

                    <label for="email">E-mail (só Gmail)</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@gmail.com"
                        required
                        autocomplete="email">

                    <button type="submit" class="btn-primary">
                        Avançar
                    </button>

                </div>

            </form>

        </section>


        <!-- ETAPA 2: SENHA -->
        <section class="login-card hidden" id="cardSenha">

            <h2>Entrar</h2>

            <p id="nomeUsuario" class="saudacao"></p>

            <form id="formSenha">

                <div class="form-group">

                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Sua senha"
                        required
                        autocomplete="current-password">

                    <p id="mensagemErro" class="erro-msg"></p>

                    <div class="btn-group">

                        <button
                            type="button"
                            class="btn-secondary"
                            onclick="voltarPara('cardEmail')">
                            Voltar
                        </button>

                        <button
                            type="submit"
                            id="btnEntrar"
                            class="btn-primary">
                            Entrar
                        </button>

                    </div>

                    <button
                        type="button"
                        id="btnEsqueci"
                        class="btn-secondary"
                        style="margin-top: 0.5rem; width: 100%;"
                        onclick="esqueciSenha()">
                        Esqueci a senha
                    </button>

                </div>

            </form>

        </section>


        <!-- ETAPA 3: CADASTRO -->
        <section class="login-card hidden" id="cardCadastro">

            <h2>Cadastrar (Sign Up)</h2>

            <form id="formCadastro">

                <div class="form-group">

                    <label for="emailCadast">E-mail</label>

                    <input
                        type="email"
                        id="emailCadast"
                        readonly>

                    <label for="nameCadast">Nome (real)</label>

                    <input
                        type="text"
                        id="nameCadast"
                        placeholder="Seu nome"
                        required
                        autocomplete="name">

                    <label for="senhaCadast">Senha</label>

                    <input
                        type="password"
                        id="senhaCadast"
                        placeholder="Sua senha"
                        required>

                    <div class="btn-group">

                        <button
                            type="button"
                            class="btn-secondary"
                            onclick="voltarPara('cardEmail')">
                            Voltar
                        </button>

                        <button
                            type="button"
                            class="btn-primary"
                            onclick="cadastrarUsuario()">
                            Finalizar Cadastro
                        </button>

                    </div>

                </div>

            </form>

        </section>

    </main>

    <script src="login.js"></script>

</body>
</html>
